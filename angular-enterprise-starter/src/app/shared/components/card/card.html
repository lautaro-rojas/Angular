<section class="card">
  @if (title() || subtitle()) {
    <header class="card-header">
      <div>
        @if (title()) {
          <h2 class="card-title">{{ title() }}</h2>
        }
        @if (subtitle()) {
          <p class="card-subtitle">{{ subtitle() }}</p>
        }
      </div>

      <!-- Slot nombrado: cualquier elemento con el atributo "card-actions" cae acá -->
      <div class="card-actions">
        <ng-content select="[card-actions]" />
      </div>
    </header>
  }

  <div class="card-body">
    <ng-content />
  </div>
</section>
